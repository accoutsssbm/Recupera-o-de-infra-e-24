<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base Excel - Recuperação Infra Salobo</title></head><body><h1>Base Excel — Recuperação Infra Salobo</h1><p id="status">Preparando arquivo...</p><button id="download" disabled>Baixar Excel</button><script>let objectUrl='';async function prepare(){let data='';for(let i=1;i<=6;i++){const name='parts/excel-'+String(i).padStart(3,'0')+'.txt';const response=await fetch(name);if(!response.ok)throw new Error('Falha ao carregar '+name);data+=await response.text();}const binary=atob(data);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);objectUrl=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));document.getElementById('status').textContent='Arquivo pronto.';document.getElementById('download').disabled=false;}document.getElementById('download').addEventListener('click',()=>{const link=document.createElement('a');link.href=objectUrl;link.download='Base_Recuperacao_Infra_Salobo_Atualizada.xlsx';link.click();});prepare().catch(e=>document.getElementById('status').textContent=e.message);</script></body></html>
