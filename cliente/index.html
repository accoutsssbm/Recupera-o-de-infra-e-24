  <style>
    :root{--ink:#171717;--paper:#f7f6f2;--yellow:#ffcd11;--muted:#62676c;--line:#deded8;--green:#18794e;--red:#bf3d36;--amber:#a66800}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.38}header{background:var(--ink);color:#fff;padding:max(20px,env(safe-area-inset-top)) 20px 22px}header>div,main{max-width:1080px;margin:auto}.mark{display:inline-block;width:34px;height:6px;background:var(--yellow);margin-bottom:14px}h1{font-size:clamp(25px,5vw,42px);line-height:1.06;margin:0 0 9px;letter-spacing:-.04em}header p{margin:0;color:#d5d5d2;font-size:14px}.controls{max-width:1080px;margin:0 auto;padding:16px 20px 10px;display:grid;gap:10px;grid-template-columns:1fr auto}.controls input,.controls select{width:100%;border:1px solid #bfc1bd;border-radius:8px;background:#fff;padding:12px;font:inherit;color:var(--ink)}main{padding:6px 20px 40px}.summary{display:flex;justify-content:space-between;align-items:baseline;gap:15px;margin:10px 0 16px;color:var(--muted);font-size:14px}.summary strong{color:var(--ink);font-size:18px}.groups{display:grid;gap:20px}.group>h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;box-shadow:0 1px 2px #0000000a}.card-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.tag{font-weight:800;font-size:12px;letter-spacing:.04em}.status{font-size:11px;font-weight:800;padding:4px 7px;border-radius:99px;white-space:nowrap;background:#f0f1ef;color:#47505a}.status.concluida{background:#dff1e7;color:var(--green)}.status.execucao{background:#fff0cf;color:var(--amber)}.status.pendente{background:#f1f2f0;color:#5c636c}.title{font-weight:750;font-size:16px;line-height:1.26;margin:0 0 14px}.meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:12px}.meta span{border-left:3px solid var(--yellow);padding-left:6px}.empty{background:#fff;border:1px dashed #bbb;padding:26px;border-radius:10px;color:var(--muted);text-align:center}.install{position:fixed;right:16px;bottom:16px;z-index:2;border:0;border-radius:99px;background:var(--yellow);color:var(--ink);padding:12px 16px;font-weight:900;box-shadow:0 4px 16px #0004;cursor:pointer;display:none}@media(max-width:600px){header{padding-left:16px;padding-right:16px}.controls{padding-left:16px;padding-right:16px;grid-template-columns:1fr}main{padding-left:16px;padding-right:16px}.cards{grid-template-columns:1fr}.card{padding:14px}.summary{margin-top:5px}}
  </style>

<body>
<header><div><span class="mark"></span><h1>Ações do Projeto</h1><p id="subtitle"></p></div></header>
<section class="controls" aria-label="Filtros de ações"><input id="search" type="search" placeholder="Buscar por ação, equipamento ou responsável" autocomplete="off"><select id="front"><option value="">Todas as frentes</option></select></section>
<main><div class="summary"><strong id="count"></strong><span>Atualização da base: <span id="base"></span></span></div><section id="list" class="groups"></section></main>
<button id="install" class="install" type="button">Instalar app</button>
<script>
const DATA={"project":"Recuperação da Frota de Infraestrutura - Salobo","base":"11/09/2026","actions":[{"id":"M1","title":"Revisar e regularizar a carteira de BL com os inspetores, priorizando ordens por criticidade e antiguidade","status":"NÃO INICIADA","due":"04/09/2026","due_iso":"2026-09-04","front":"Macro","responsible":"MACRO","equipment":"MACRO","party":"","priority":""},{"id":"M2","title":"Incluir os consultores de Suporte ao Produto no acompanhamento dos pedidos: Cleane para tratores e Washington para motoniveladoras","status":"NÃO INICIADA","due":"19/09/2026","due_iso":"2026-09-19","front":"Macro","responsible":"MACRO","equipment":"MACRO","party":"","priority":""},{"id":"M3","title":"Analisar o atendimento dos pedidos Sotreq em relação aos BLs abertos e aos prazos requeridos","status":"NÃO INICIADA","due":"04/10/2026","due_iso":"2026-10-04","front":"Macro","responsible":"MACRO","equipment":"MACRO","party":"","priority":""},{"id":"M4","title":"Monitorar o indicador OTF dos pedidos Sotreq vinculados aos BLs abertos","status":"NÃO INICIADA","due":"19/11/2026","due_iso":"2026-11-19","front":"Macro","responsible":"MACRO","equipment":"MACRO","party":"","priority":""},{"id":"MA84-A1","title":"Eliminar a reincidencia de hidraulico (28 paradas) e lubrificacao (10 paradas) com campanha de estanqueidade e revisao do sistema de lubrificacao centralizada","status":"NÃO INICIADA","due":"19/09/2026","due_iso":"2026-09-19","front":"Motoniveladoras","responsible":"Ligriarno","equipment":"MA84","party":"","priority":""},{"id":"MA84-A2","title":"Priorizar o atendimento do coxim do tanque de diesel em espera na oficina e os 5 BLs em AGMT sem pedido (69 h), incluindo a vedacao de tandem da campanha das motoniveladoras","status":"NÃO INICIADA","due":"04/10/2026","due_iso":"2026-10-04","front":"Motoniveladoras","responsible":"Ligriarno","equipment":"MA84","party":"","priority":""},{"id":"MA82-A1","title":"Executar campanha de estanqueidade hidraulica (20 paradas, 297 h) e corrig radas), o despacho/GPS (11 paradas) e o eletrico (9 paradas), corrigindo falhas de conexão de conector","status":"NÃO INICIADA","due":"19/09/2026","due_iso":"2026-09-19","front":"Leonardo","responsible":"Leonardo","equipment":"TT84","party":"","priority":""},{"id":"TT84-A2","title":"Auditar o escopo da preventiva de 250 h que consumiu 512 h em julho e registrar em BL tudo o que foi executado fora do plano de manutencao","status":"NÃO INICIADA","due":"04/10/2026","due_iso":"2026-10-04","front":"Leonardo","responsible":"Leonardo","equipment":"TT84","party":"","priority":""},{"id":"TT83-A1","title":"Substituir mangueiras e coxins do tanque hidraulico (8 paradas, 210 h) e corrigir a reincidencia de motor de combustao (16 paradas)","status":"NÃO INICIADA","due":"19/09/2026","due_iso":"2026-09-19","front":"Leonardo","responsible":"Leonardo","equipment":"TT83","party":"","priority":""},{"id":"TT83-A2","title":"Executar as 5 preventivas vencidas (57 h) e liberar os 6 BLs de estrutura com material comprado ha mais de 300 dias","status":"NÃO INICIADA","due":"04/10/2026","due_iso":"2026-10-04","front":"Leonardo","responsible":"Leonardo","equipment":"TT83","party":"","priority":""},{"id":"TT82-A1","title":"Corrigir a reincidencia de despacho (9 paradas) e motor (4 paradas) e investigar os 93 alarmes altos do sensor de posicao da alavanca de transmissao","status":"NÃO INICIADA","due":"19/09/2026","due_iso":"2026-09-19","front":"Leonardo","responsible":"Leonardo","equipment":"TT82","party":"","priority":""},{"id":"TT82-A2","title":"Executar as 15 manutenções preventivas vencidas da carteira (302 h), agrupando em janelas de manutencao programada","status":"NÃO INICIADA","due":"04/10/2026","due_iso":"2026-10-04","front":"Leonardo","responsible":"Leonardo","equipment":"TT82","party":"","priority":""},{"id":"TT85-A1","title":"Restabelecer a condição técnica do sistema hidráulico (24 paradas) e o conjunto de esteira LD (13 paradas) - as duas maiores reincidencias da frota inteira","status":"NÃO INICIADA","due":"19/09/2026","due_iso":"2026-09-19","front":"Kleber","responsible":"Kleber","equipment":"TT85","party":"","priority":""},{"id":"TT85-A2","title":"Priorizar o atendimento do cilindro do ripper L/D (OM 202604129502) e o eixo de articulacao/pivo (OM 202603737278, 144 h em AGMT sem pedido), executando os dois na mesma janela","status":"NÃO INICIADA","due":"04/10/2026","due_iso":"2026-10-04","front":"Kleber","responsible":"Kleber","equipment":"TT85","party":"","priority":""},{"id":"TT56-A1","title":"Corrigir a reincidencia de hidraulico (19 paradas) incluindo a valvula do piloto do escarificador, e reprogramar a preventiva com troca de truck em duas janelas separadas","status":"NÃO INICIADA","due":"19/09/2026","due_iso":"2026-09-19","front":"Kleber","responsible":"Kleber","equipment":"TT56","party":"","priority":""},{"id":"TT56-A2","title":"Executar os 8 BLs de estrutura (104 h) e os 3 de motor (216 h), incluindo o SPOT de tubo de escape e manta que esta sem pedido","status":"NÃO INICIADA","due":"04/10/2026","due_iso":"2026-10-04","front":"Kleber","responsible":"Kleber","equipment":"TT56","party":"","priority":""},{"id":"TT55-A1","title":"Emitir pedido e concluir a preventiva geral 6000 h (OM 202603656367) hoje em execucao, e reprogramar as 9 preventivas vencidas da carteira (418 h)","status":"NÃO INICIADA","due":"19/09/2026","due_iso":"2026-09-19","front":"Kleber","responsible":"Kleber","equipment":"TT55","party":"","priority":""},{"id":"TT55-A2","title":"Habilitar e validar o monitoramento embarcado do equipamento e tratar a reincidencia de motor de combustao (4 paradas, 85 h)","status":"NÃO INICIADA","due":"04/10/2026","due_iso":"2026-10-04","front":"Kleber","responsible":"Kleber","equipment":"TT55","party":"","priority":""},{"id":"TT57-A1","title":"Vedar o circuito hidraulico (12 paradas, 158 h) e concluir a tratativa definitiva da turbina L/D com analise de oleo e acompanhamento de tendencia","status":"NÃO INICIADA","due":"19/09/2026","due_iso":"2026-09-19","front":"Kleber","responsible":"Kleber","equipment":"TT57","party":"","priority":""},{"id":"TT57-A2","title":"Emitir pedidos para os 9 BLs em AGMT (249 h), com prioridade para a mesa do ripper (212 dias) e os trucks LE/LD (308 dias)","status":"NÃO INICIADA","due":"04/10/2026","due_iso":"2026-10-04","front":"Kleber","responsible":"Kleber","equipment":"TT57","party":"","priority":""},{"id":"V-01","title":"Executar teste de eficiência e inspeção de condição dos conjuntos de freio das motoniveladoras MA81 a MA85","status":"NÃO INICIADA","due":"","due_iso":"","front":"Motoniveladoras","responsible":"LIGRIARNO / RALDE","equipment":"MA81–MA85","party":"Vale","priority":"Alta"},{"id":"V-02","title":"Solicitar empréstimo de 4 conjuntos de freio junto à Vale CKS / Gerência GAMAM","status":"NÃO INICIADA","due":"","due_iso":"","front":"Motoniveladoras","responsible":"LIGRIARNO / RALDE","equipment":"MA81–MA85","party":"Vale","priority":"Crítica"},{"id":"V-03","title":"Transferir ao CRC Sotreq os 2 conjuntos de freio disponíveis em Salobo para recondicionamento","status":"NÃO INICIADA","due":"","due_iso":"","front":"Motoniveladoras","responsible":"LIGRIARNO / RALDE","equipment":"MA81–MA85","party":"Vale","priority":"Crítica"},{"id":"V-04","title":"Definir a estratégia de aquisição de conjuntos de freio e componentes de recondicionamento para as motoniveladoras 24M","status":"NÃO INICIADA","due":"","due_iso":"","front":"Motoniveladoras","responsible":"LIGRIARNO / RALDE","equipment":"MA81–MA85","party":"Vale","priority":"Alta"},{"id":"S-01","title":"Dimensionar e validar o estoque de componentes para recondicionamento dos conjuntos de freio 24 e 24M","status":"NÃO INICIADA","due":"","due_iso":"","front":"Motoniveladoras","responsible":"LIGRIARNO / RALDE","equipment":"MA81–MA85","party":"Sotreq","priority":"Crítica"},{"id":"S-02","title":"Solicitar priorização dos pedidos críticos junto à Caterpillar por meio do processo formal de escalonamento","status":"NÃO INICIADA","due":"","due_iso":"","front":"Motoniveladoras","responsible":"LIGRIARNO / RALDE","equipment":"MA81–MA85","party":"Sotreq / CSP","priority":"Crítica"},{"id":"S-03","title":"Reservar capacidade prioritária da linha de montagem do CRC para recondicionamento dos conjuntos de freio","status":"NÃO INICIADA","due":"","due_iso":"","front":"Motoniveladoras","responsible":"LIGRIARNO / RALDE","equipment":"MA81–MA85","party":"Sotreq / Gerência Suporte ao Produto","priority":"Crítica"},{"id":"FREIO-BL","title":"Carteira de BLs do sistema de freio - subações do projeto","status":"EM EXECUÇÃO","due":"","due_iso":"","front":"Motoniveladoras","responsible":"LIGRIARNO / RALDE","equipment":"MA81–MA85","party":"Vale / Sotreq","priority":"Crítica"}]};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normal=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const labelStatus=s=>{const n=normal(s);return n.includes('conclu')?'CONCLUÍDA':n.includes('execu')?'EM EXECUÇÃO':'PENDENTE'};
const slug=s=>labelStatus(s)==='CONCLUÍDA'?'concluida':labelStatus(s)==='EM EXECUÇÃO'?'execucao':'pendente';
const fronts=[...new Set(DATA.actions.map(a=>a.front))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
document.getElementById('subtitle').textContent=DATA.project+' · acesso público às ações'; document.getElementById('base').textContent=DATA.base;
document.getElementById('front').innerHTML+fronts.map(f=>'<option>'+esc(f)+'</option>').join('');
function render(){const q=normal(document.getElementById('search').value),front=document.getElementById('front').value;const arr=DATA.actions.filter(a=>!front||a.front===front).filter(a=>!q||normal([a.title,a.equipment,a.responsible,a.front,a.party].join(' ')).includes(q));document.getElementById('count').textContent=arr.length+' '+(arr.length===1?'ação':'ações');const groups=Object.groupBy(arr,a=>a.front);document.getElementById('list').innerHTML=arr.length?Object.entries(groups).sort(([a],[b])=>a.localeCompare(b,'pt-BR')).map(([name,items])=>'<section class="group"><h2>'+esc(name)+'</h2><div class="cards">'+items.map(a=>'<article class="card"><div class="card-top"><span class="tag">'+esc(a.equipment||a.id)+'</span><span class="status '+slug(a.status)+'">'+labelStatus(a.status)+'</span></div><p class="title">'+esc(a.title)+'</p><div class="meta"><span>Responsável: '+esc(a.responsible)+'</span>'+(a.due?'<span>Prazo: '+esc(a.due)+'</span>':'')+(a.priority?'<span>Prioridade: '+esc(a.priority)+'</span>':'')+'</div></article>').join('')+'</div></section>').join(''):'<div class="empty">Nenhuma ação encontrada com este filtro.</div>'}render();document.getElementById('search').addEventListener('input',render);document.getElementById('front').addEventListener('change',render);
let deferredPrompt;const install=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.style.display='block'});install.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.style.display='none'});if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
