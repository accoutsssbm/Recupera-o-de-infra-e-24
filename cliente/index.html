KEY='salobo-cliente-progresso-v2';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let S={action:{},sub:{}};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){};S.action||={};S.sub||={};
const subsFor=id=>DATA.subactions.filter(s=>s.action_id===id);const baseDone=x=>norm(x.status).includes('conclu');const subDone=s=>S.sub[s.id]===undefined?baseDone(s):S.sub[s.id];const viewSubs=(a,t='')=>subsFor(a.id).filter(s=>!t||s.equipment===t);const actionDone=a=>{const subs=subsFor(a.id);return subs.length?subs.every(subDone):(S.action[a.id]===undefined?baseDone(a):S.action[a.id])};const viewDone=(a,t='')=>{const subs=viewSubs(a,t);return subs.length?subs.every(subDone):actionDone(a)};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)); const fronts=[...new Set(DATA.actions.map(a=>a.front))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
subtitle.textContent=DATA.project+' · acompanhamento de ações';

function units(arr,t=''){let total=0,done=0;arr.forEach(a=>{const allSubs=subsFor(a.id),subs=viewSubs(a,t);if(allSubs.length){total+=subs.length;done+=subs.filter(subDone).length}else{total++;if(actionDone(a))done++}});return {total,done,pct:total?Math.round(done*100/total):0}}
function meter(label,p){const dash=(Math.max(0,Math.min(100,p.pct))/100*157).toFixed(1);return '<article class="meter"><svg viewBox="0 0 120 70" aria-hidden="true"><path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="#e1e3df" stroke-width="13" stroke-linecap="round"/><path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="#ffcd11" stroke-width="13" stroke-linecap="round" pathLength="157" stroke-dasharray="'+dash+' 157"/></svg><div><b>'+p.pct+'%</b><small>'+esc(label)+' · '+p.done+'/'+p.total+' unidades</small></div></article>'}
function render(){const f=front.value,t=tag.value,q=norm(search.value);const filtered=DATA.actions.filter(a=>(!f||a.front===f)&&(!t||a.equipment===t||subsFor(a.id).some(s=>s.equipment===t))&&(!q||norm([a.title,a.equipment,a.responsible,a.front].join(' ')).includes(q)));meters.innerHTML=meter('Execução selecionada',units(filtered,t))+meter('Execução total do projeto',units(DATA.actions));const grouped=Object.groupBy(filtered,a=>a.front);list.innerHTML=filtered.length?Object.entries(grouped).sort(([a],[b])=>a.localeCompare(b,'pt-BR')).map(([name,items])=>'<section class="group"><h2>'+esc(name)+'</h2><div class="cards">'+items.map(a=>{const subs=viewSubs(a,t), done=viewDone(a,t), p=units([a],t);return '<article class="card"><div class="action"><div class="actiontop"><input class="check" type="checkbox" aria-label="Concluir ação" '+(done?'checked':'')+' onchange="toggleAction(&quot;'+esc(a.id)+'&quot;,this.checked,&quot;'+esc(t)+'&quot;)"><div><span class="tag">'+esc(a.equipment)+'</span><p class="title">'+esc(a.title)+'</p></div><span class="state '+(done?'done':'')+'">'+(done?'CONCLUÍDA':'PENDENTE')+'</span></div><div class="meta"><span>Responsável: '+esc(a.responsible)+'</span>'+(a.due?'<span>Prazo: '+esc(a.due)+'</span>':'')+(a.priority?'<span>Prioridade: '+esc(a.priority)+'</span>':'')+'</div></div>'+(subs.length?'<details><summary>'+p.done+'/'+p.total+' subações · tocar para abrir</summary><div class="subs">'+subs.map(s=>'<label class="subrow"><input class="check" type="checkbox" '+(subDone(s)?'checked':'')+' onchange="toggleSub(&quot;'+esc(s.id)+'&quot;,this.checked)"><span><b>'+esc(s.type)+(s.number?' · '+esc(s.number):'')+'</b>'+esc(s.description)+'</span></label>').join('')+'</div></details>':'')+'</article>'}).join('')+'</div></section>').join(''):'<div class="empty">Nenhuma ação encontrada com estes filtros.</div>'}
function toggleAction(id,checked,t=''){const a=DATA.actions.find(x=>x.id===id),subs=viewSubs(a,t);if(subs.length)subs.forEach(s=>S.sub[s.id]=checked);else S.action[id]=checked;save();render()};function toggleSub(id,checked){S.sub[id]=checked;save();render()};window.toggleAction=toggleAction;window.toggleSub=toggleSub;
front.addEventListener('change',()=>{resetTags();render()});tag.addEventListener('change',render);search.addEventListener('input',render);resetTags();render();
