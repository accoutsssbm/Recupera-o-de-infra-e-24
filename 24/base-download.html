<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base oficial | Recuperação Infra Salobo</title><style>body{margin:0;background:#171717;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:780px;margin:10vh auto;padding:28px}.bar{height:6px;background:#ffcd11;margin:16px 0}.muted{color:#bbb}.err{color:#ffb4ab;white-space:pre-wrap}button,a.btn{display:inline-block;background:#ffcd11;border:0;color:#111;font-weight:900;padding:12px 18px;border-radius:8px;cursor:pointer;text-decoration:none;margin:6px 6px 6px 0}button:disabled{opacity:.45;cursor:not-allowed}a{color:#ffcd11}</style></head><body><div class="wrap"><h1>Base de dados — pasta 24</h1><div class="bar"></div><p id="status">Preparando base a partir do dashboard publicado...</p><p class="muted">Esta página gera uma planilha compatível com Excel usando os dados do release público. A base editável completa está no pacote limpo da pasta 24.</p><button id="download" disabled>Baixar base Excel (.xls)</button><a class="btn" href="../index.html">Voltar ao dashboard</a><p id="err" class="err"></p></div><script>
let projectData=null;const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function gunzip(b64){const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text();}
async function loadHtml(){const files=['../parts/index-gz-001.b64','../parts/index-gz-002.b64'],chunks=[];for(const p of files){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+p+': HTTP '+r.status);chunks.push((await r.text()).replace(/\s+/g,''));}try{return await gunzip(chunks.join(''));}catch(e){chunks[0]='H4sIAAAAAAAC'+chunks[0].slice(12,-1)+'I';chunks[1]=chunks[1].slice(1);return await gunzip(chunks.join(''));}}
function rowsFromMap(obj){return Object.entries(obj||{}).map(([tag,val])=>({tag,...(val||{})}));}
function sheet(name,rows){if(!rows||!rows.length)return '';const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];let x='<Worksheet ss:Name="'+esc(name.slice(0,31))+'"><Table><Row>'+cols.map(c=>'<Cell><Data ss:Type="String">'+esc(c)+'</Data></Cell>').join('')+'</Row>';for(const r of rows){x+='<Row>'+cols.map(c=>{let v=r[c];if(v&&typeof v==='object')v=JSON.stringify(v);const t=typeof v==='number'&&Number.isFinite(v)?'Number':'String';return '<Cell><Data ss:Type="'+t+'">'+esc(v)+'</Data></Cell>';}).join('')+'</Row>';}return x+'</Table></Worksheet>';}
function workbook(d){const parts=[sheet('Acoes',d.actions),sheet('Subacoes',d.subactions),sheet('Freios',d.brake_components),sheet('Plano Freios',d.brake_plan),sheet('Curva',d.curve),sheet('Resumo BL',rowsFromMap(d.bl_summary))];return '<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+parts.join('')+'</Workbook>';}
async function prepare(){const html=await loadHtml(),m=html.match(/window\.PROJETO_DATA=(\{.*?\});<\/script>/s);if(!m)throw new Error('Dados do projeto não encontrados no release.');projectData=JSON.parse(m[1]);document.getElementById('status').textContent='Base pronta para download.';document.getElementById('download').disabled=false;}
document.getElementById('download').addEventListener('click',()=>{try{const xml=workbook(projectData),url=URL.createObjectURL(new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='Base_Recuperacao_Infra_Salobo_Atualizada.xls';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}catch(e){document.getElementById('err').textContent=e.message;}});
prepare().catch(e=>{document.getElementById('status').textContent='Não foi possível preparar a base.';document.getElementById('err').textContent=e.message;});
</script></body></html>
