<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visão Gerencial · Freios 24/24M · Salobo</title><style>body{margin:0;background:#171717;color:#fff;font-family:Arial,sans-serif}.box{max-width:760px;margin:12vh auto;padding:32px}.bar{height:6px;background:#ffcd11;margin:18px 0}.err{color:#ffb4ab}</style></head><body><div class="box"><h1>Visão Gerencial · Freios 24/24M</h1><div class="bar"></div><p id="status">Carregando visão gerencial…</p><div id="err" class="err"></div></div><script>(async()=>{const f=['freios-parts/freios-gz-001.b64','freios-parts/freios-gz-002.b64','freios-parts/freios-gz-003.b64','freios-parts/freios-gz-004.b64','freios-parts/freios-gz-005.b64','freios-parts/freios-gz-006.b64','freios-parts/freios-gz-007.b64'];let s='';for(const p of f){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error('Falha ao carregar '+p);s+=(await r.text()).replace(/\s+/g,'')}const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const out=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(out);document.close();const stamp=document.querySelector('header .stamp');if(stamp&&!document.getElementById('project-access')){const a=document.createElement('a');a.id='project-access';a.href='../';a.textContent='Abrir Projeto de Recuperação ↗';a.style.cssText='display:inline-block;margin-top:8px;background:#f5c400;color:#171717;text-decoration:none;padding:7px 9px;font-size:10px;font-weight:900;border-radius:4px';stamp.appendChild(document.createElement('br'));stamp.appendChild(a)}})().catch(e=>{document.getElementById('status').textContent='Não foi possível carregar a visão.';document.getElementById('err').textContent=e.message})</script></body></html>
