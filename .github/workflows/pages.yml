name: Deploy Recuperacao Infra Salobo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Materialize dashboard HTML with corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          chunks=[Path('parts/index-gz-001.b64').read_text().strip(),Path('parts/index-gz-002.b64').read_text().strip()]
          def inflate(c): return gzip.decompress(base64.b64decode(''.join(c))).decode('utf-8')
          try: html=inflate(chunks)
          except Exception:
              chunks[0]='H4sIAAAAAAAC'+chunks[0][12:-1]+'I'; chunks[1]=chunks[1][1:]; html=inflate(chunks)
          html=html.replace('href="Base_Recuperacao_Infra_Salobo_Atualizada.xlsx" download','href="24/base-download.html"')
          html=html.replace('OnePage_Gerencial_Freios_24_24M.html','24/onepage-template.html')
          css=".v8grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.v8br{background:#1f1f1f;border:1px solid #333;border-radius:12px;padding:12px}.v8posg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.v8pos{background:#611e1e;border-radius:8px;text-align:center;padding:8px}.v8pos.ok{background:#123b26}.v8pos.att{background:#4a3a10}.v8bl{background:#151515;border-left:4px solid #ffcd11;border-radius:8px;padding:8px;margin:6px 0}.v8bl.warn{border-left-color:#ff6b6b}.v8k{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.v8k b{background:#1d1d1d;border:1px solid #333;border-radius:10px;padding:12px}.v8pct{font-size:52px;color:#ffcd11;font-weight:900}.v8svg{width:100%;background:#161616;border:1px solid #333;border-radius:12px}.v8svg line{stroke:#444}.v8svg text{fill:#ddd;font-size:11px}.v8svg .plan{fill:none;stroke:#ffcd11;stroke-width:4}.v8svg .done{fill:none;stroke:#69d391;stroke-width:4;stroke-dasharray:7 5}.v8subpct{font-size:12px;margin-left:auto;min-width:160px}.v8subpct span{display:block;height:7px;background:#333;border-radius:99px;overflow:hidden;margin-top:4px}.v8subpct i{display:block;height:100%;background:#ffcd11}.v8one{background:#ffcd11;color:#111;border:0;border-radius:8px;padding:9px 12px;font-weight:900;margin:4px;cursor:pointer}"
          js="\n(function(){\nconst B=[['MA81','24M','EXECUTADA ESTA SEMANA','P\u00f3s-substitui\u00e7\u00e3o: confirmar estanqueidade',['OK','OK','OK','OK'],'Aplicado esta semana','BLs existentes no painel: 202604624483 e 202601010530'],['MA84','24M','P1 CR\u00cdTICO','SIM \u2014 evid\u00eancia recente',['VAZ','VAZ','VAZ','VAZ'],'06/10/2026','BL 202603329261 \u00b7 nota 202601113255'],['MA82','24M','P3 CR\u00cdTICO','SIM \u2014 evid\u00eancia recente',['VAZ','VAZ','VAZ','VAZ'],'25/11/2026','BL 202604330867 \u00b7 nota 202601462870'],['MA83','24M','P4 CONFIRMAR','A CONFIRMAR',['ATN','VAZ','VAZ','ATN'],'20/12/2026','BL 202604330866 \u00b7 nota 202601463105'],['MA85','24','P5 CR\u00cdTICO','SIM \u2014 falha confirmada na desmontagem',['VAZ','VAZ','VAZ','VAZ'],'14/01/2027','Sem BL aberto identificado; abrir BL antes de programar substitui\u00e7\u00e3o']];\nconst P=[['16/09','Recond. MA84',0,1],['06/10','Troca MA84',1,1],['11/10','MA81 p\u00f3s',2,1],['29/10','Material MA82',2,1],['25/11','Troca MA82',3,1],['20/12','Troca MA83',4,1],['14/01','Troca MA85',5,1]];\nconst h=v=>String(v??'').replace(/[&<>\\\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[s]));\nfunction acts(scope){let a=D.actions||[]; if(!scope||scope==='global'||scope==='home')return a; if(scope==='Freios')return a.filter(x=>x.project_type==='FREIOS'||x.front==='Motoniveladoras'); return a.filter(x=>x.front===scope||x.equipment===scope)}\nfunction prog(a){let s=(D.subactions||[]).filter(x=>x.action_id===a.id);return s.length?Math.round(100*s.filter(x=>S.sub[x.id]).length/s.length):(S.done[a.id]?100:0)}\nfunction avg(scope){let a=acts(scope);return a.length?Math.round(a.reduce((t,x)=>t+prog(x),0)/a.length):0}\nfunction bls(tag){let rows=(D.subactions||[]).filter(x=>x.project_type==='FREIOS'&&x.equipment===tag&&x.type==='BL');return rows.length?rows.map(x=>`<div class=\"v8bl\"><b>BL ${h(x.number)}</b>${x.linked_note?' \u00b7 nota '+h(x.linked_note):''}<br>${h(x.description)}<br><small>${h(x.source_status||'')}</small></div>`).join(''):`<div class=\"v8bl warn\"><b>Sem BL aberto identificado.</b><br>Manter nota de substitui\u00e7\u00e3o e abrir BL antes da programa\u00e7\u00e3o.</div>`}\nfunction bcard(m){let pos=['DE','TE','DD','TD'].map((p,i)=>`<span class=\"v8pos ${m[4][i]=='OK'?'ok':m[4][i]=='ATN'?'att':'bad'}\"><b>${p}</b>${m[4][i]}</span>`).join('');return `<article class=\"v8br\" id=\"freio-${m[0]}\"><h3>${m[0]} \u00b7 ${m[1]}</h3><b>${h(m[2])}</b><p><b>Vazamento:</b> ${h(m[3])}</p><div class=\"v8posg\">${pos}</div><p><b>Suba\u00e7\u00e3o:</b> substituir/validar freios vazando conforme condi\u00e7\u00e3o da m\u00e1quina.</p><p><b>Prazo:</b> ${h(m[5])}</p><p>${h(m[6])}</p>${bls(m[0])}</article>`}\nfunction curve(){let w=900,H=230,max=5,pts=P.map((p,i)=>[45+i*(w-90)/(P.length-1),H-35-p[2]*(H-70)/max]),done=P.map((p,i)=>[45+i*(w-90)/(P.length-1),H-35-p[3]*(H-70)/max]);let path=a=>a.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return `<svg class=\"v8svg\" viewBox=\"0 0 ${w} ${H}\"><line x1=\"45\" y1=\"20\" x2=\"45\" y2=\"${H-35}\"/><line x1=\"45\" y1=\"${H-35}\" x2=\"${w-25}\" y2=\"${H-35}\"/><path class=\"plan\" d=\"${path(pts)}\"/><path class=\"done\" d=\"${path(done)}\"/>${P.map((p,i)=>`<text x=\"${pts[i][0]}\" y=\"${H-10}\" text-anchor=\"middle\">${p[0]}</text>`).join('')}<text x=\"60\" y=\"34\">Planejado</text><text x=\"60\" y=\"54\">Executado</text></svg>`}\nfunction monitor(){return `<section class=\"panel\" id=\"freios-monitor\"><div class=\"ph\"><h2>Monitoramento de vazamento dos freios</h2><small>MA81 atualizada: recebeu/aplicou freios esta semana</small></div><div class=\"v8grid\">${B.map(bcard).join('')}</div></section><section class=\"panel\" id=\"kits-n1n2\"><div class=\"ph\"><h2>Kits N1/N2 \u2014 disponibilidade e prazos</h2><small>24M e 24</small></div><div class=\"v8k\"><b>N2 completos: 0</b><b>24M N2 Brasil: 72% \u00b7 Global: 84%</b><b>24 N2 Brasil: 81% \u00b7 Global: 89%</b><b>Pr\u00f3xima janela material: 29/10/2026</b></div><p>Lead time n\u00e3o informado na base. MA84 \u00e9 prioridade; MA81 est\u00e1 em p\u00f3s-servi\u00e7o; MA82 exige elimina\u00e7\u00e3o de restri\u00e7\u00e3o N2 antes da janela.</p></section><section class=\"panel\" id=\"curva-freios\"><div class=\"ph\"><h2>Curva S \u2014 planejamento de troca dos conjuntos de freios</h2><small>MA81\u2013MA85</small></div>${curve()}</section>`}\nfunction campanhas(){return `<section class=\"panel\" id=\"campanhas\"><div class=\"ph\"><h2>Painel de campanhas</h2><small>link e dados consolidados</small></div><p><b>Link direto:</b> <a href=\"https://accoutsssbm.github.io/Recupera-o-de-infra-e-24/?v=v8#campanhas\">abrir campanhas no painel</a></p><div class=\"v8k\"><b>D11 eixo comando: 87%</b><b>D11 radiador: 87%</b><b>24 eixo comando MA85\u2013MA88: 67%</b><b>350 inspe\u00e7\u00f5es/tensores: em curso</b></div></section>`}\nfunction banner(){return `<section class=\"panel\" id=\"progresso-subacoes\"><div class=\"ph\"><h2>Avan\u00e7o executado por suba\u00e7\u00f5es</h2><small>cada suba\u00e7\u00e3o marcada recalcula o avan\u00e7o</small></div><div class=\"v8pct\">${avg('global')}%</div><p>O avan\u00e7o do projeto passa a ser calculado pelo avan\u00e7o m\u00e9dio das a\u00e7\u00f5es, usando as suba\u00e7\u00f5es marcadas como executadas.</p></section>`}\nfunction cards(){document.querySelectorAll('.actioncard').forEach(c=>{if(c.dataset.v8)return;let t=(c.querySelector('h3')?.textContent||'').replace(/^\\d+\\.\\s*/,'').trim(),a=(D.actions||[]).find(x=>String(x.title).trim()===t||t.includes(String(x.title).trim()));if(!a)return;let p=prog(a),d=document.createElement('div');d.className='v8subpct';d.innerHTML=`<b>${p}% executado por suba\u00e7\u00f5es</b><span><i style=\"width:${p}%\"></i></span>`;(c.querySelector('.actiontitle')||c).appendChild(d);c.dataset.v8=1})}\nfunction add(){let g=document.getElementById('groups');if(g&&!document.getElementById('campanhas'))g.insertAdjacentHTML('beforebegin',banner()+campanhas()+monitor());let p=document.getElementById('page-Motoniveladoras');if(p&&!p.querySelector('#freios-monitor-detail'))(p.querySelector('.detailhead')||p).insertAdjacentHTML('afterend',`<div id=\"freios-monitor-detail\">${monitor()}</div>`);document.querySelectorAll('header,.detailhead').forEach(e=>{if(e.querySelector('.v8one'))return;let b=document.createElement('button');b.className='v8one';b.textContent='Gerar OnePage atual';b.onclick=()=>generateOnePage(e.closest('.screen')?.id?.replace('page-','')||'global');e.appendChild(b)});cards()}\nwindow.generateOnePage=function(scope='global'){let a=acts(scope),rows=a.map(x=>`<tr><td>${h(x.front||x.equipment||'MACRO')}</td><td>${h(x.title)}</td><td>${prog(x)}%</td><td>${h(x.deadline||'')}</td></tr>`).join('');let html=`<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>OnePage ${h(scope)}</title><style>body{margin:0;background:#171717;color:white;font-family:Arial}header,main{max-width:1100px;margin:auto;padding:24px}.panel{background:#222;border:1px solid #333;border-radius:12px;padding:14px;margin:10px 0}.k{font-size:44px;color:#ffcd11;font-weight:900}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #333;padding:8px;text-align:left}button{background:#ffcd11;border:0;border-radius:8px;padding:10px 14px;font-weight:900}@media print{button{display:none}}</style></head><body><header><h1>OnePage \u2014 Recupera\u00e7\u00e3o Infra Salobo</h1><p>Escopo: ${h(scope)} \u00b7 ${new Date().toLocaleString('pt-BR')}</p><button onclick=\"window.print()\">Salvar em PDF</button></header><main><section class=\"panel\"><b>Avan\u00e7o por suba\u00e7\u00f5es</b><div class=\"k\">${avg(scope)}%</div></section>${(scope==='global'||scope==='home'||scope==='Motoniveladoras')?monitor():''}<section class=\"panel\"><h2>A\u00e7\u00f5es</h2><table><tr><th>Frente</th><th>A\u00e7\u00e3o</th><th>%</th><th>Prazo</th></tr>${rows}</table></section></main></body></html>`;let w=window.open('','_blank','noopener,noreferrer');if(w){w.document.write(html);w.document.close()}else{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='OnePage_Recuperacao_Infra_Salobo.html';a.click()}}\ntry{let od=done;done=function(id,v){let view=activeView();S.done[id]=v;(D.subactions||[]).filter(x=>x.action_id===id).forEach(x=>S.sub[x.id]=v);save();renderHome();buildDetails();restoreView(view);setTimeout(add,0)};let os=subDone;subDone=function(id,v){let view=activeView();S.sub[id]=v;let s=(D.subactions||[]).find(x=>x.id===id);if(s){let peers=(D.subactions||[]).filter(x=>x.action_id===s.action_id);S.done[s.action_id]=peers.every(x=>S.sub[x.id])}save();renderHome();buildDetails();restoreView(view);setTimeout(add,0)};let or=renderHome;renderHome=function(){or();add()};let ob=buildDetails;buildDetails=function(){ob();add()};let ow=show;show=function(n){ow(n);setTimeout(add,0)}}catch(e){console.warn(e)}\nadd();\n})();\n"
          html=html.replace('</style>','/* V8_CORRECOES */'+chr(10)+css+chr(10)+'</style>',1)
          html=html.replace('</body>','<script>'+chr(10)+'/* V8_CORRECOES */'+chr(10)+js+chr(10)+'</script></body>',1)
          Path('index.html').write_text(html,encoding='utf-8')
          print('materialized_bytes',len(html.encode('utf-8')))
          print('v8', 'V8_CORRECOES' in html, 'MA81' in html, 'generateOnePage' in html)
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
