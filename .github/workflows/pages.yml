name: Deploy Recuperacao Infra Salobo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize original XLSX in repository
        if: ${{ hashFiles('Base_Recuperacao_Infra_Salobo_Atualizada.xlsx') == '' }}
        env:
          XLSX_URL: https://api.onedrive.com/v1.0/shares/u!aHR0cHM6Ly8xZHJ2Lm1zL3gvYy9hZjNjMjNhZWEzNmVhMjc5L0lRQUhGXzdZT1c2aVRxSUxPZGo2YjZzREFSNjg4YWs0WDI2M1RySkJyTDdoYV9r/root/content
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "$XLSX_URL" -o Base_Recuperacao_Infra_Salobo_Atualizada.xlsx
          echo "947520a51a8aac9e03bfd5081d15150910c1a723df13235f0b0a449ff1e04b6a  Base_Recuperacao_Infra_Salobo_Atualizada.xlsx" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Base_Recuperacao_Infra_Salobo_Atualizada.xlsx
          git commit -m "Add original XLSX release"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
