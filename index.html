<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperação da Infraestrutura - Salobo</title><style>body{margin:0;font-family:Arial,sans-serif;background:#171717;color:#fff;display:grid;place-items:center;min-height:100vh}.box{max-width:620px;padding:32px;text-align:center}.bar{height:6px;background:#ffcd11;margin:18px 0}.err{color:#ffb4ab;white-space:pre-wrap}</style></head><body><div class="box"><h1>Recuperação da Infraestrutura - Salobo</h1><div class="bar"></div><p id="status">Carregando painel...</p><div id="err" class="err"></div></div><script>
(async()=>{
  const parts=Array.from({length:15},(_,i)=>`parts/index-${String(i+1).padStart(3,'0')}.txt`);
  const chunks=[];
  for(const p of parts){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(`Falha ao carregar ${p}: ${r.status}`);chunks.push(await r.text());}
  let html=chunks.join('');
  html=html.replaceAll('Base_Recuperacao_Infra_Salobo_Atualizada.xlsx','excel-download.html');
  document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('status').textContent='Não foi possível carregar o painel.';document.getElementById('err').textContent=e.message;});
</script></body></html>
