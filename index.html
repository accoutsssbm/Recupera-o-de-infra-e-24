<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotsheet | Recuperação da Infraestrutura - Salobo</title><style>html,body{margin:0;min-height:100%;background:#171717;color:#fff;font-family:Arial,sans-serif}.box{max-width:680px;margin:12vh auto;padding:32px}.bar{height:6px;background:#ffcd11;margin:18px 0}.err{color:#ffb4ab;white-space:pre-wrap}</style></head><body><div class="box"><h1>Recuperação da Infraestrutura - Salobo</h1><div class="bar"></div><p id="status">Carregando painel validado...</p><div id="err" class="err"></div></div><script>(async()=>{const files=['parts/index-gz-001.b64','parts/index-gz-002.b64'],chunks=[];for(const p of files){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+p+': HTTP '+r.status);chunks.push((await r.text()).replace(/\s+/g,''))}async function inflate(list){const b64=list.join(''),bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}let html;try{html=await inflate(chunks)}catch(primaryError){const legacy=[...chunks];legacy[0]='H4sIAAAAAAAC'+legacy[0].slice(12,-1)+'I';legacy[1]=legacy[1].slice(1);try{html=await inflate(legacy)}catch(legacyError){throw new Error('Falha ao descompactar o painel: '+legacyError.message)}}html=html.replaceAll('Base_Recuperacao_Infra_Salobo_Atualizada.xlsx','excel-download.html');document.open();document.write(html);document.close()})().catch(e=>{document.getElementById('status').textContent='Não foi possível carregar o painel.';document.getElementById('err').textContent=e.message});</script></body></html>
