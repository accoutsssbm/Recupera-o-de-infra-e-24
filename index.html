<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperação da Infraestrutura — Salobo</title>
<style>html,body{margin:0;min-height:100%;background:#171717;color:#fff;font-family:Arial,sans-serif}.box{max-width:760px;margin:12vh auto;padding:32px}.bar{height:6px;background:#ffcd11;margin:18px 0}.err{color:#ffb4ab;white-space:pre-wrap}.muted{color:#bdbdbd}</style>
</head>
<body><div class="box"><h1>Recuperação da Infraestrutura — Salobo</h1><div class="bar"></div><p id="status">Carregando painel publicado…</p><p class="muted">Dashboard integrado à programação das frotas e às baixas dos apps.</p><div id="err" class="err"></div></div>
<script>
(async()=>{
 const files=['parts/index-gz-001.b64','parts/index-gz-002.b64','parts/index-gz-003.b64'];
 const chunks=[];
 for(const p of files){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+p+': HTTP '+r.status);chunks.push((await r.text()).replace(/\s+/g,''));}
 const b64=chunks.join(''),bin=atob(b64),bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
 const html=await new Response(stream).text();
 document.open();document.write(html);document.close();
 const live=document.createElement('script');
 live.src='live-v7.js?v=20260924a';
 live.async=false;
 live.onload=()=>{
   const axis=document.createElement('script');
   axis.src='axis-bottom-v8.js?v=20260924a';
   axis.async=false;
   document.body.appendChild(axis);
 };
 document.body.appendChild(live);
 const nav=document.querySelector('#home .nav');
 if(nav&&!document.getElementById('project-access')){
   const a=document.createElement('a');
   a.id='project-access';a.href='./';a.textContent='Projeto de Recuperação de Infra';
   a.style.cssText='display:inline-flex;align-items:center;background:#ffcd11;color:#171717;font-weight:800;text-decoration:none';
   nav.prepend(a);
 }
 // Organiza Macro + responsáveis em blocos verticais para preservar a leitura das curvas e medições.
 const layoutStyle=document.createElement('style');
 layoutStyle.textContent=`
   .engineer-stack-vertical{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:18px!important;align-items:start!important;width:100%!important;max-width:none!important}
   .engineer-stack-vertical>.engineer-stack-card{width:100%!important;max-width:none!important;min-width:0!important}
   .engineer-stack-card svg{max-width:100%!important}
   .engineer-stack-card [class*="chart"],.engineer-stack-card [class*="Chart"]{width:100%!important;max-width:none!important}
 `;
 document.head.appendChild(layoutStyle);
 const applyVerticalEngineerLayout=()=>{
   const scope=document.getElementById('home')||document.body;
   const headings=[...scope.querySelectorAll('h1,h2,h3,h4,strong')];
   const markers=headings.filter(el=>{
     const t=(el.textContent||'').toLowerCase();
     return t.includes('curva s macro')||t.includes('projeto principal - 24/24m')||t.includes('curva s de execução');
   });
   if(markers.length<3)return false;
   const depth=el=>{let d=0;while(el&&el!==document.body){d++;el=el.parentElement}return d};
   let best=null,bestDepth=-1;
   for(const marker of markers){
     let p=marker.parentElement;
     while(p&&p!==document.body){
       const hitChildren=[...p.children].filter(ch=>markers.some(m=>ch===m||ch.contains(m)));
       if(hitChildren.length>=3){const d=depth(p);if(d>bestDepth){best=p;bestDepth=d}}
       p=p.parentElement;
     }
   }
   if(!best)return false;
   best.classList.add('engineer-stack-vertical');
   [...best.children].forEach(ch=>{
     if(markers.some(m=>ch===m||ch.contains(m)))ch.classList.add('engineer-stack-card');
   });
   return true;
 };
 applyVerticalEngineerLayout();
 setTimeout(applyVerticalEngineerLayout,300);
 setTimeout(applyVerticalEngineerLayout,1200);
})().catch(e=>{document.getElementById('status').textContent='Não foi possível carregar o painel.';document.getElementById('err').textContent=e.message;});
</script></body></html>
