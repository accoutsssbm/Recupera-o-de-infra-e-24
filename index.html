y></html>';\n   const w=window.open('','_blank','noopener,noreferrer'); if(!w){alert('Permita pop-ups para gerar o OnePage.');return;} w.document.open(); w.document.write(out); w.document.close();\n };\n function addButtons(){\n   if(document.getElementById('btn-onepage-atual'))return;\n   const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin:10px 0';\n   wrap.innerHTML='<button id=\"btn-onepage-atual\" onclick=\"generateOnePage()\">Gerar OnePage atual</button><button onclick=\"location.href=\\'24/base-download.html\\'\">Base Excel oficial</button>';\n   (document.querySelector('header')||document.body).prepend(wrap);\n }\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',addButtons);else addButtons();\n})();\n"+'<'+'/scr'+'ipt>';
